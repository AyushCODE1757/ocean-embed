[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanembed-ingest"
version = "0.1.0"
description = "OceanEmbed M1 Data Ingestion and Manifest Engine"
requires-python = ">=3.10"
dependencies = [
    "oceanembed-contracts",
    "numpy",
    "pandas",
    "xarray",
    "requests",
    "pyyaml",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]
